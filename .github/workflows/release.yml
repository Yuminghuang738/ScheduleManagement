# ChronoFlow 打包发布（Release Build）
#
# 触发时机：推送形如 v1.0.0 的 tag，或在 Actions 页面手动触发。
#
# 做什么
#   1. 在 Windows 与 Linux 两个 runner 上分别打包桌面安装包
#   2. 把安装包作为 Artifact 上传（手动触发时可直接下载）
#   3. 若是 tag 触发，额外创建一个 GitHub Release 并附上安装包
#
# 注意：仓库未提交 resources/icon.{ico,png}，而 electron-builder.yml 引用了它们，
# 因此打包前先执行 .github/scripts/generate-icons.mjs 生成占位图标。
name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先在单一 runner 上验证，避免两边同时失败浪费额度
  verify:
    name: 预检（类型 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建桌面端
        run: npx electron-vite build

  package:
    name: 打包 ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: chronoflow-windows
          - os: ubuntu-latest
            script: build:linux
            artifact: chronoflow-linux

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成占位应用图标
        run: node .github/scripts/generate-icons.mjs

      - name: 打包安装包
        run: npm run ${{ matrix.script }}
        env:
          # 不在此步骤发布，统一交给后续 Release 步骤
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出打包产物
        shell: bash
        run: ls -lh dist/ || true

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lhR artifacts

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*